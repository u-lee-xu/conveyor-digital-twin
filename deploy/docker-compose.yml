services:
  # Sakura FRP 内网穿透启动器
  natfrp-service:
    image: natfrp.com/launcher:latest
    container_name: natfrp-service
    restart: always
    network_mode: host
    
    environment:
      # 访问密钥 - 在 https://www.natfrp.com/ 获取
      - NATFRP_TOKEN=${NATFRP_TOKEN:-your_token_here}
      # 远程管理密码 - 自行设定，至少8个字符
      - NATFRP_REMOTE=${NATFRP_REMOTE:-digital_twin_remote}
      # 时区
      - TZ=Asia/Shanghai
    
    volumes:
      # 配置文件持久化
      - ./natfrp-config:/run
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7102"]
      interval: 30s
      timeout: 10s
      retries: 3

# 如需使用 WebUI 管理，启动后访问:
# https://127.0.0.1:7102
# 密码在容器日志中查看: docker logs natfrp-service
